version: 2

updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/workflows"
      - "/.github/actions/*"
    groups:
      ci:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
