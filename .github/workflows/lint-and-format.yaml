name: lint-and-format

on:
  workflow_call:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: "lint: Mise"
        run: mise lint:mise

      - name: "lint: Biome"
        run: mise lint:biome

      - name: "lint: Compile"
        run: mise lint:compile
