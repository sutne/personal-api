name: lint-and-format

on:
  workflow_call:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: "lint: Mise"
        run: mise lint:mise

      - name: "lint: Biome"
        run: mise lint:biome

      - name: "lint: Compile"
        run: mise lint:compile
