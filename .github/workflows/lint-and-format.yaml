name: lint-and-format

on:
  workflow_call:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: "lint: Mise"
        run: mise lint:mise

      - name: "lint: Biome"
        run: mise lint:biome

      - name: "lint: Compile"
        run: mise lint:compile
